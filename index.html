<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>配對韓風小人仔 😙</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@600;800;900&family=Noto+Sans+TC:wght@600;800;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'M PLUS Rounded 1c', 'Noto Sans TC', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background-color: #f7f9fd;
      background-image: radial-gradient(#dbe3f0 1.2px, transparent 1.2px);
      background-size: 18px 18px;
    }

    /* 3D 卡牌容器與翻轉效果 (完美兼容手機與網頁) */
    .card-container {
      perspective: 800px;
      -webkit-perspective: 800px;
    }
    
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.38s cubic-bezier(0.4, 0.0, 0.2, 1);
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      border-radius: 1rem;
    }
    
    .card-container.is-flipped .card-inner,
    .card-container.is-matched .card-inner {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 4px 8px -2px rgba(59, 130, 246, 0.15), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    
    /* 卡牌背面 (藍底白字 ?) */
    .card-back {
      background: linear-gradient(145deg, #5b79ea, #4766db);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotateY(0deg) translateZ(1px);
      -webkit-transform: rotateY(0deg) translateZ(1px);
    }
    
    /* 卡牌正面 (公仔相片) */
    .card-front {
      background: #ffffff;
      border: 2.5px solid #e2e8f0;
      transform: rotateY(180deg) translateZ(1px);
      -webkit-transform: rotateY(180deg) translateZ(1px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-container.is-matched .card-front {
      border-color: #10b981;
      border-width: 3px;
    }

    /* 裁切圖片樣式：完美放大 1.18 倍，無留白且不切邊 */
    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.18);
      transform-origin: center center;
      display: block;
      pointer-events: none;
    }

    /* 配對成功輕微彈跳 */
    @keyframes matchPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    .card-container.is-matched {
      animation: matchPop 0.3s ease-out;
    }

    /* 慶祝彩色碎紙屑 */
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      opacity: 0;
      animation: fall 2.5s ease-out forwards;
    }
    @keyframes fall {
      0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(80vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-between text-slate-800 p-3 sm:p-4 select-none">

  <!-- 頂部資訊欄 -->
  <header class="w-full max-w-[340px] sm:max-w-[380px] flex flex-col items-center mt-2 relative">
    
    <!-- 遊戲主標題 -->
    <div class="text-center mb-1">
      <h1 class="text-2xl font-black tracking-wide text-slate-800 flex items-center justify-center gap-1.5">
        配對韓風小人仔 <span class="text-2xl">😙</span>
      </h1>
    </div>

    <!-- 狀態資訊列：步數與時間 -->
    <div class="w-full flex items-center justify-between mt-3 px-1">
      <div class="text-slate-600 font-extrabold text-base flex items-center gap-1">
        <span>Moves:</span>
        <span id="moveCount" class="text-slate-900 text-lg">0</span>
      </div>

      <div class="flex items-center gap-3">
        <!-- 音效開關 -->
        <button id="soundToggle" class="text-slate-500 hover:text-slate-800 p-1 rounded-full text-base transition-transform active:scale-90" title="切換音效">
          <span id="soundIcon">🔊</span>
        </button>
        <!-- 時間 -->
        <div class="text-slate-500 font-bold text-sm bg-white px-2.5 py-0.5 rounded-full border border-slate-200 shadow-inner flex items-center gap-1">
          <span>⏱️</span>
          <span id="timerText">00:00</span>
        </div>
      </div>
    </div>
  </header>

  <!-- 遊戲主卡牌網格 (4x4 完美方形陣列共 16 張) -->
  <main class="w-full max-w-[340px] sm:max-w-[380px] flex-1 flex flex-col items-center justify-center my-3">
    <div id="cardGrid" class="grid grid-cols-4 gap-2.5 sm:gap-3 w-full aspect-square">
      <!-- 由 JavaScript 動態生成 16 張乾淨卡片 -->
    </div>
  </main>

  <!-- 底部操作區 -->
  <footer class="w-full max-w-[340px] sm:max-w-[380px] flex flex-col items-center gap-3 pb-3">
    <button id="restartBtn" class="flex items-center justify-center gap-2 w-full max-w-[180px] py-2.5 px-4 bg-white hover:bg-slate-50 text-slate-700 text-sm font-bold rounded-2xl border-2 border-slate-200 shadow-md active:scale-95 transition-all">
      <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      <span>Restart</span>
    </button>
    <p class="text-xs text-slate-400 font-semibold">翻開相同的小女孩卡片完成配對 🌸</p>
  </footer>

  <!-- 通關勝利彈窗 Modal -->
  <div id="winModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
    <div class="bg-white rounded-3xl p-6 max-w-xs w-full text-center shadow-2xl transform scale-90 transition-transform duration-300 border-4 border-amber-200 relative overflow-hidden">
      <!-- 頂部裝飾小插圖 -->
      <div class="w-16 h-16 mx-auto -mt-2 mb-2">
        <svg viewBox="0 0 100 100" class="w-full h-full animate-bounce">
          <circle cx="50" cy="50" r="45" fill="#fef08a"/>
          <circle cx="35" cy="45" r="5" fill="#713f12"/>
          <circle cx="65" cy="45" r="5" fill="#713f12"/>
          <ellipse cx="25" cy="55" rx="6" ry="3" fill="#f87171" opacity="0.6"/>
          <ellipse cx="75" cy="55" rx="6" ry="3" fill="#f87171" opacity="0.6"/>
          <path d="M 35 60 Q 50 78 65 60" fill="none" stroke="#713f12" stroke-width="4" stroke-linecap="round"/>
          <text x="50" y="25" font-size="16" text-anchor="middle">👑</text>
        </svg>
      </div>

      <h2 class="text-2xl font-black text-slate-800 mb-1">太厲害了！🎉</h2>
      <p class="text-xs font-bold text-amber-600 mb-4 tracking-wide">所有小女孩都找到同伴了！</p>

      <!-- 統計數據 -->
      <div class="bg-slate-50 rounded-2xl p-3 border border-slate-100 flex justify-around mb-5">
        <div>
          <div class="text-[11px] text-slate-400 font-bold uppercase">總步數</div>
          <div id="finalMoves" class="text-xl font-black text-[#5373ea]">0</div>
        </div>
        <div class="w-[1px] bg-slate-200"></div>
        <div>
          <div class="text-[11px] text-slate-400 font-bold uppercase">用時</div>
          <div id="finalTime" class="text-xl font-black text-emerald-500">00:00</div>
        </div>
      </div>

      <!-- 再玩一局按鈕 -->
      <div>
        <button id="modalPlayAgain" class="w-full py-3 bg-[#5373ea] hover:bg-[#4361d8] text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 active:scale-95 transition-all text-sm">
          再玩一局 🎮
        </button>
      </div>
    </div>
  </div>

  <!-- 提示通知 (Toast) -->
  <div id="toast" class="fixed top-16 bg-slate-800/90 text-white text-xs font-bold px-4 py-2 rounded-full shadow-lg z-50 transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-2">
    已重新開始新一局！
  </div>

  <script>
    /* ==========================================================================
       1. 卡牌圖片資料庫 (01.jpeg 至 05.jpeg)
       ========================================================================== */
    const CARD_DATA = [
      { id: '01', imgUrl: 'https://tcshun.github.io/MatchingKorean/01.jpeg' },
      { id: '02', imgUrl: 'https://tcshun.github.io/MatchingKorean/02.jpeg' },
      { id: '03', imgUrl: 'https://tcshun.github.io/MatchingKorean/03.jpeg' },
      { id: '04', imgUrl: 'https://tcshun.github.io/MatchingKorean/04.jpeg' },
      { id: '05', imgUrl: 'https://tcshun.github.io/MatchingKorean/05.jpeg' }
    ];

    /* ==========================================================================
       2. Web Audio 音效引擎
       ========================================================================== */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }

      playFlip() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(560, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }

      playMatch() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.07);
          gain.gain.setValueAtTime(0.25, now + idx * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.07);
          osc.stop(now + idx * 0.07 + 0.2);
        });
      }

      playVictory() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const melody = [
          { f: 523.25, d: 0.15 }, { f: 659.25, d: 0.15 }, { f: 783.99, d: 0.15 },
          { f: 1046.50, d: 0.3 }, { f: 880, d: 0.2 }, { f: 1046.50, d: 0.5 }
        ];
        let t = now;
        melody.forEach(note => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(note.f, t);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + note.d);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + note.d);
          t += note.d * 0.85;
        });
      }
    }

    /* ==========================================================================
       3. 遊戲邏輯 (4x4 / 8組配對)
       ========================================================================== */
    const sound = new SoundEngine();
    let cards = [];
    let flippedCards = [];
    let matchedCount = 0;
    let moves = 0;
    let timerInterval = null;
    let secondsElapsed = 0;
    let isLocked = false;

    // DOM 元素
    const cardGrid = document.getElementById('cardGrid');
    const moveCountEl = document.getElementById('moveCount');
    const timerTextEl = document.getElementById('timerText');
    const restartBtn = document.getElementById('restartBtn');
    const soundToggle = document.getElementById('soundToggle');
    const soundIcon = document.getElementById('soundIcon');
    const winModal = document.getElementById('winModal');
    const finalMoves = document.getElementById('finalMoves');
    const finalTime = document.getElementById('finalTime');
    const modalPlayAgain = document.getElementById('modalPlayAgain');
    const toast = document.getElementById('toast');

    function triggerHaptic(ms = 30) {
      if (navigator.vibrate) {
        try { navigator.vibrate(ms); } catch (e) {}
      }
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.remove('opacity-0', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-2');
      }, 1600);
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function startTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        secondsElapsed++;
        timerTextEl.textContent = formatTime(secondsElapsed);
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    // 初始化/重設遊戲
    function initGame() {
      stopTimer();
      secondsElapsed = 0;
      moves = 0;
      matchedCount = 0;
      flippedCards = [];
      isLocked = false;
      
      moveCountEl.textContent = '0';
      timerTextEl.textContent = '00:00';
      winModal.classList.add('hidden');
      winModal.classList.remove('opacity-100');

      // 8 組配對 (共 16 張牌)
      const selectedPairs = [
        CARD_DATA[0],
        CARD_DATA[1],
        CARD_DATA[2],
        CARD_DATA[3],
        CARD_DATA[4],
        CARD_DATA[0],
        CARD_DATA[1],
        CARD_DATA[2]
      ];

      const deck = [];
      selectedPairs.forEach((item, index) => {
        deck.push({ uniqueKey: `${index}-A`, cardId: item.id, cardData: item });
        deck.push({ uniqueKey: `${index}-B`, cardId: item.id, cardData: item });
      });

      cards = shuffle(deck);
      renderBoard();
    }

    // 繪製卡牌
    function renderBoard() {
      cardGrid.innerHTML = '';

      cards.forEach((card, index) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card-container aspect-square cursor-pointer';
        cardEl.dataset.index = index;

        // 生成乾淨、無多餘雜訊的 HTML 結構
        cardEl.innerHTML = `
          <div class="card-inner">
            <div class="card-back">
              <span class="text-2xl sm:text-3xl font-black text-white select-none">?</span>
            </div>
            <div class="card-front">
              <img src="${card.cardData.imgUrl}" alt="Card" class="card-img" />
            </div>
          </div>
        `;

        cardEl.addEventListener('click', () => handleCardClick(cardEl, card));
        cardGrid.appendChild(cardEl);
      });
    }

    // 卡牌點擊
    function handleCardClick(cardEl, card) {
      if (isLocked) return;
      if (cardEl.classList.contains('is-flipped') || cardEl.classList.contains('is-matched')) return;

      if (moves === 0 && flippedCards.length === 0 && !timerInterval) {
        startTimer();
      }

      sound.playFlip();
      triggerHaptic(20);
      cardEl.classList.add('is-flipped');
      flippedCards.push({ element: cardEl, data: card });

      if (flippedCards.length === 2) {
        moves++;
        moveCountEl.textContent = moves;
        checkMatch();
      }
    }

    // 配對檢查
    function checkMatch() {
      const [card1, card2] = flippedCards;
      const isMatch = card1.data.cardId === card2.data.cardId;

      if (isMatch) {
        setTimeout(() => {
          sound.playMatch();
          triggerHaptic(50);
          card1.element.classList.add('is-matched');
          card2.element.classList.add('is-matched');
          matchedCount++;
          flippedCards = [];

          if (matchedCount === 8) {
            handleGameWin();
          }
        }, 280);
      } else {
        isLocked = true;
        setTimeout(() => {
          card1.element.classList.remove('is-flipped');
          card2.element.classList.remove('is-flipped');
          flippedCards = [];
          isLocked = false;
        }, 750);
      }
    }

    // 獲勝結算
    function handleGameWin() {
      stopTimer();
      sound.playVictory();
      triggerHaptic(100);

      finalMoves.textContent = moves;
      finalTime.textContent = formatTime(secondsElapsed);

      createConfetti();

      setTimeout(() => {
        winModal.classList.remove('hidden');
        setTimeout(() => {
          winModal.classList.add('opacity-100');
          winModal.querySelector('div').classList.remove('scale-90');
          winModal.querySelector('div').classList.add('scale-100');
        }, 50);
      }, 450);
    }

    // 慶祝紙屑
    function createConfetti() {
      const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
      for (let i = 0; i < 35; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = `${Math.random() * 100}vw`;
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDelay = `${Math.random() * 0.4}s`;
        confetti.style.transform = `scale(${Math.random() * 0.8 + 0.6})`;
        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 2600);
      }
    }

    // 按鈕監聽
    restartBtn.addEventListener('click', () => {
      triggerHaptic(20);
      initGame();
      showToast('已重新開始新一局！🔄');
    });

    modalPlayAgain.addEventListener('click', () => {
      triggerHaptic(20);
      initGame();
    });

    // 音效開關切換
    soundToggle.addEventListener('click', () => {
      sound.muted = !sound.muted;
      soundIcon.textContent = sound.muted ? '🔇' : '🔊';
      showToast(sound.muted ? '音效已關閉' : '音效已開啟');
    });

    // 啟動遊戲
    window.addEventListener('DOMContentLoaded', initGame);
  </script>
</body>
</html>
